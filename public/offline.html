<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth is offline</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #f6f7f9, #e7e9ee); color: #111; }
  @media (prefers-color-scheme: dark) { body { background: linear-gradient(180deg, #1c1d20, #111214); color: #f3f4f6; } }
  main { display: grid; justify-items: center; gap: 10px; padding: 24px; text-align: center; }
  h1 { margin: 8px 0 0; font-size: 20px; font-weight: 500; }
  p { margin: 0; max-width: 32ch; opacity: .7; line-height: 1.45; }
  button { margin-top: 12px; height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: currentColor; font: inherit; font-weight: 500; cursor: pointer; }
  button span { color: Canvas; }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#111"/><path d="M8.6 14.6 16 8.4l7.4 6.2v8.1a1.3 1.3 0 0 1-1.3 1.3H9.9a1.3 1.3 0 0 1-1.3-1.3z" fill="none" stroke="#fff" stroke-width="2.1" stroke-linejoin="round"/><path d="M16 13.6c.4 1.6 2.9 2.9 2.9 5.4a2.9 2.9 0 0 1-5.8 0c0-1.2.6-2 1.3-2.6.1.9.5 1.4 1 1.7-.2-1.6.2-3.2.6-4.5z" fill="#fbbf24"/></svg>
  <h1>Hearth is offline</h1>
  <p>This screen cannot reach your Hearth server right now. It will reconnect on its own.</p>
  <button type="button" onclick="location.reload()"><span>Try again</span></button>
</main>
<script>setInterval(function () { fetch("/", { cache: "no-store" }).then(function (r) { if (r.ok) location.reload(); }).catch(function () {}); }, 15000);</script>
</body>
</html>
